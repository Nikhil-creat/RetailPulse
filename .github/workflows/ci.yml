name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests
        run: python -m pytest -q
      - name: End-to-end pipeline (quick)
        run: python -m retailpulse.cli run-all --quick
      - name: RAG + agent evals
        run: python -m retailpulse.cli eval
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t retailpulse:ci .
