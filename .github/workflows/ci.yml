name: RetailPulse CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx
      - name: Verify AI & Security modules import cleanly
        run: |
          PYTHONPATH=src python -c "from retailpulse.ai.model_router import AutoModelRouter; from retailpulse.ai.agentic_rag import HybridRAGEngine, AgenticOrchestrator; from retailpulse.ai.cnn_vision import ShelfCNNInspector; print('V3_MODULES_OK')"
      - name: Run test suite
        run: |
          if [ -d tests ]; then PYTHONPATH=src pytest -q; fi
