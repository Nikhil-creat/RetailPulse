name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Canonical URL written into <link rel="canonical">, the sitemap and social tags.
  # Leave the repository variable SITE_URL unset to canonicalise to this GitHub Pages copy; set it to your
  # primary domain (for example the Cloudflare one) and this copy will point search engines there instead.
  SITE_URL: ${{ vars.SITE_URL || 'https://nikhil-creat.github.io/RetailPulse' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the warehouse and models (synthetic data, seed 42)
        run: python -m retailpulse.cli run-all
      - name: Export the static site (served under /RetailPulse on GitHub Pages)
        run: python -m retailpulse.cli export-static --out site --site-url "$SITE_URL" --base-path /RetailPulse
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
